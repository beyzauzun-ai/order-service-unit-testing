<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div class="glass-container">
        <header style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: -10px;">
            <img src="timer.png" alt="Timer Icon" style="width: 120px; height: 120px; object-fit: cover; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);">
            <h1>Focus</h1>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
            <button class="mode-btn" data-mode="shortBreak">Short Break</button>
            <button class="mode-btn" data-mode="longBreak">Long Break</button>
        </div>

        <div class="timer-display">
            <svg class="progress-ring" width="280" height="280">
                <circle class="progress-ring__circle-bg" stroke="rgba(255, 255, 255, 0.4)" stroke-width="6" fill="transparent" r="130" cx="140" cy="140"/>
                <circle class="progress-ring__circle" stroke="rgba(255, 255, 255, 0.9)" stroke-width="6" fill="transparent" r="130" cx="140" cy="140" stroke-linecap="round"/>
            </svg>
            <div class="time" id="time">25:00</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">Start</button>
            <button class="btn btn-secondary" id="resetBtn" aria-label="Reset Timer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
